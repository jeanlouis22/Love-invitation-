<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Une petite surprise ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ENVELOPPE -->

    <div id="enveloppeScreen" class="screen">

        <div class="enveloppe-container">

            <div class="enveloppe">

                <div class="enveloppe-fond"></div>

                <div class="enveloppe-rabat"></div>

                <div class="coeur">

                    ❤️

                </div>

            </div>

            <p class="texte">

                Touchez la lettre 💌

            </p>

        </div>

    </div>

    <!-- LETTRE -->

    <div id="lettreScreen" class="screen cache">

        <div class="lettre">

            <p class="petit-titre">

                POUR TOI,

            </p>

            <h1 id="prenom">

               Anni ❤️

            </h1>

            <div class="separateur">

                ♡

            </div>

            <h2>

                Ça te dit un date avec moi ? 🥹❤️

            </h2>

            <p class="sous-titre">

                Dire non ne sert à rien… mais tu peux essayer 🤭

            </p>

            <div class="boutons">

                <button id="oui" class="bouton-oui">

                    ❤️ Oui

                </button>

                <button id="non" class="bouton-non">

                    🤍 Non

                </button>

            </div>

            <p id="messageNon" class="message-non"></p>

        </div>

    </div>
<!-- PAGE ORGANISATION DU DATE -->

<div id="dateScreen" class="screen cache">

    <div class="date-card">

        <div class="coeur-haut">

            💕

        </div>

        <h1>

            Parfait ❤️

        </h1>

        <h2>

            On va se voir !

        </h2>

        <p class="sous-titre">

            Choisis le jour et l'heure qui te conviennent 🥰

        </p>

        <!-- LIEU -->

        <div class="champ">

            <label>

                📍 Lieu

            </label>

            <div id="lieu" class="lieu">

                Le lieu sera indiqué ici

            </div>

        </div>

        <!-- JOUR -->

        <div class="champ">

            <label for="date">

                📅 Choisis le jour

            </label>

            <input

                type="date"

                id="date"

            >

        </div>

        <!-- HEURE -->

        <div class="champ">

            <label for="heure">

                🕒 Choisis l'heure

            </label>

            <input

                type="time"

                id="heure"

            >

        </div>

        <!-- PETIT MOT -->

        <div class="champ">

            <label for="petitMot">

                💌 Un petit mot pour moi

                <span>(facultatif)</span>

            </label>

            <textarea

                id="petitMot"

                rows="4"

                placeholder="Écris-moi quelque chose 🥰"

            ></textarea>

        </div>

        <button id="confirmer" class="bouton-confirmer">

            Confirmer ❤️

        </button>

        <p id="erreur" class="erreur"></p>

    </div>

</div>
    <script src="script.js"></script>


</body>

</html>
