<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Une question pour toi ❤️</title>
<style>
body{
font-family: Arial;
text-align:center;
background:#ffe6ee;
padding:40px;
}
h1{
color:#e91e63;
}
button{
padding:15px 25px;
margin:10px;
border:none;
border-radius:20px;
font-size:18px;
}
.oui{
background:#e91e63;
color:white;
}
.non{
background:#555;
color:white;
}
#message{
margin-top:30px;
font-size:20px;
}
</style>
</head>

<body>

<h1>Salut toi 😳❤️</h1>

<p>
J’ai une petite question à te poser...<br><br>
Est-ce que tu accepterais un petit date avec moi ? 🌹
</p>

<button class="oui" onclick="oui()">Oui 😍</button>
<button class="non" onclick="non()">Non 😶</button>

<div id="message"></div>

<script>
function oui(){
document.getElementById("message").innerHTML=
"Yesss 😍❤️ Merci d’avoir accepté mon invitation 🌹";
}

function non(){
document.getElementById("message").innerHTML=
"T’es sûre ? 😳 Réfléchis encore un peu 🥹❤️";
}
</script>

</body>
</html>
